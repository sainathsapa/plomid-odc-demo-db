# nfpm config TEMPLATE for the Linux .deb/.rpm (do not edit the generated
# copy). dist/linux/make-packages.sh substitutes @@VERSION@@, @@ARCH@@ and
# @@STAGE@@ into a generated file before invoking nfpm, so no tool version
# needs to support environment expansion inside the config.
name: plomid
arch: "@@ARCH@@"
version: "@@VERSION@@"
section: database
priority: optional
maintainer: PLOMID Technologies INDIA <info.djsai@gmail.com>
description: |-
  PLOMID database server (PostgreSQL wire protocol).
  Single static-ish binary plus a systemd unit; data lives in /var/lib/plomid.
vendor: PLOMID Technologies INDIA
homepage: https://github.com/plomid/plomid
license: Apache-2.0
contents:
  - src: @@STAGE@@/plomid-server
    dst: /usr/local/bin/plomid-server
    type: file
    file_info:
      mode: 0755
  - src: @@STAGE@@/plomid.service
    dst: /lib/systemd/system/plomid.service
    type: file
    file_info:
      mode: 0644
  - src: @@STAGE@@/README.txt
    dst: /usr/share/doc/plomid/README.txt
    type: file
    file_info:
      mode: 0644
  - src: @@STAGE@@/plomid-emblem-copper.png
    dst: /usr/share/pixmaps/plomid.png
    type: file
    file_info:
      mode: 0644
  - src: @@STAGE@@/plomid.desktop
    dst: /usr/share/applications/plomid.desktop
    type: file
    file_info:
      mode: 0644
scripts:
  postinstall: @@STAGE@@/postinstall.sh
  preremove: @@STAGE@@/preremove.sh
deb:
  fields:
    Depends: adduser
rpm:
  group: Applications/Databases
  prefixes: ["/usr"]
