    <text x="738" y="289.5" fill="#a0a6ae">APACHE-2.0</text>

    <rect x="860" y="272" width="266" height="26" rx="13" fill="#0c0e11" stroke="rgba(255,255,255,0.20)"/>
    <circle cx="877" cy="285" r="3.5" fill="#e2683c"/>
    <text x="888" y="289.5" fill="#a0a6ae">POSTGRES WIRE COMPATIBLE</text>

    <rect x="1140" y="272" width="166" height="26" rx="13" fill="#0c0e11" stroke="rgba(255,255,255,0.20)"/>
    <circle cx="1157" cy="285" r="3.5" fill="#e2683c"/>
    <text x="1168" y="289.5" fill="#a0a6ae">v0.1.0-beta.1</text>
  </g>

  <!-- corner ticks -->
  <g stroke="#e2683c" stroke-width="2" fill="none" opacity="0.9">
    <path d="M 24 36 L 24 24 L 36 24"/>
    <path d="M 1874 24 L 1886 24 L 1886 36"/>
    <path d="M 24 284 L 24 296 L 36 296"/>
