  <!-- tagline -->
  <text x="955" y="253" text-anchor="middle" font-family="'IBM Plex Mono','SFMono-Regular',Menlo,monospace" font-size="16" font-weight="500" letter-spacing="7" fill="#a0a6ae">PLATFORM FOR MODERN INTELLIGENCE AND DATA</text>

  <!-- status badges -->
  <g font-family="'IBM Plex Mono','SFMono-Regular',Menlo,monospace" font-size="12" letter-spacing="2">
    <rect x="604" y="272" width="92"  height="26" rx="13" fill="#0c0e11" stroke="rgba(255,255,255,0.20)"/>
    <circle cx="621" cy="285" r="3.5" fill="#e2683c"/>
