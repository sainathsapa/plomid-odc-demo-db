<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1910 320" role="img" aria-labelledby="bnT bnD">
  <title id="bnT">PLOMID, Platform for Modern Intelligence and Data</title>
  <desc id="bnD">One data layer for rows, documents and time-ordered events. A PostgreSQL-wire-compatible universal database platform written in Rust.</desc>
  <defs>
    <linearGradient id="cu" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e2683c"/>
      <stop offset="1" stop-color="#f0925f"/>
    </linearGradient>
    <linearGradient id="seam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e2683c" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f0925f"/>
      <stop offset="1" stop-color="#e2683c" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- ink surface -->
  <rect width="1910" height="320" fill="#08090b"/>

  <!-- engineering grid: vertical hairlines -->
  <g stroke="#ffffff" stroke-opacity="0.045" stroke-width="1">
    <line x1="118.75" y1="0" x2="118.75" y2="320"/>
    <line x1="237.5"  y1="0" x2="237.5"  y2="320"/>
    <line x1="356.25" y1="0" x2="356.25" y2="320"/>
    <line x1="475"    y1="0" x2="475"    y2="320"/>
    <line x1="593.75" y1="0" x2="593.75" y2="320"/>
    <line x1="712.5"  y1="0" x2="712.5"  y2="320"/>
    <line x1="831.25" y1="0" x2="831.25" y2="320"/>
    <line x1="950"    y1="0" x2="950"    y2="320"/>
    <line x1="1068.75" y1="0" x2="1068.75" y2="320"/>
    <line x1="1187.5" y1="0" x2="1187.5" y2="320"/>
    <line x1="1306.25" y1="0" x2="1306.25" y2="320"/>
    <line x1="1425"   y1="0" x2="1425"   y2="320"/>
    <line x1="1543.75" y1="0" x2="1543.75" y2="320"/>
    <line x1="1662.5" y1="0" x2="1662.5" y2="320"/>
    <line x1="1781.25" y1="0" x2="1781.25" y2="320"/>
  </g>

  <!-- the seam: one copper rule on the top edge -->
  <rect x="0" y="0" width="1910" height="3" fill="url(#seam)"/>

