  <g font-family="'Inter',-apple-system,'Segoe UI',system-ui,sans-serif">
    <rect x="300" y="428" width="288" height="80" rx="2" fill="rgba(226,104,60,0.08)" stroke="#e2683c" stroke-width="1"/>
    <rect x="576" y="440" width="10" height="10" fill="#e2683c"/>
    <text x="316" y="462" font-size="14" font-weight="600" fill="#f2f2ef">CLI &amp; diagnostics</text>
    <text x="316" y="484" font-family="'IBM Plex Mono',ui-monospace,Menlo,monospace" font-size="9.5" fill="#a0a6ae">readiness · health · benchmark</text>
    <text x="316" y="498" font-family="'IBM Plex Mono',ui-monospace,Menlo,monospace" font-size="9" fill="#e2683c">AVAILABLE TODAY</text>

    <rect x="612" y="428" width="288" height="80" rx="2" fill="rgba(226,104,60,0.08)" stroke="#e2683c" stroke-width="1"/>
    <rect x="888" y="440" width="10" height="10" fill="#e2683c"/>
    <text x="628" y="462" font-size="14" font-weight="600" fill="#f2f2ef">Structured logs</text>
    <text x="628" y="484" font-family="'IBM Plex Mono',ui-monospace,Menlo,monospace" font-size="9.5" fill="#a0a6ae">connection_id · query_id · durations</text>
    <text x="628" y="498" font-family="'IBM Plex Mono',ui-monospace,Menlo,monospace" font-size="9" fill="#e2683c">AVAILABLE TODAY</text>

    <rect x="924" y="428" width="288" height="80" rx="2" fill="rgba(226,104,60,0.08)" stroke="#e2683c" stroke-width="1"/>
    <rect x="1200" y="440" width="10" height="10" fill="#e2683c"/>
    <text x="940" y="462" font-size="14" font-weight="600" fill="#f2f2ef">Docker · packages</text>
    <text x="940" y="484" font-family="'IBM Plex Mono',ui-monospace,Menlo,monospace" font-size="9.5" fill="#a0a6ae">dmg · deb · rpm · tar.gz</text>
    <text x="940" y="498" font-family="'IBM Plex Mono',ui-monospace,Menlo,monospace" font-size="9" fill="#e2683c">AVAILABLE TODAY</text>

    <rect x="1236" y="428" width="300" height="80" rx="2" fill="url(#shatch)" stroke="#6b7178" stroke-width="1" stroke-dasharray="4 3"/>
    <rect x="1512" y="440" width="10" height="10" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="1"/>
    <text x="1252" y="462" font-size="14" font-weight="600" fill="#a0a6ae">TLS · multi-node ops</text>
    <text x="1252" y="484" font-family="'IBM Plex Mono',ui-monospace,Menlo,monospace" font-size="9.5" fill="#6b7178">replication · backups</text>
    <text x="1252" y="498" font-family="'IBM Plex Mono',ui-monospace,Menlo,monospace" font-size="9" fill="#6b7178">ROADMAP</text>
  </g>

  <!-- legend -->
  <g font-family="'IBM Plex Mono',ui-monospace,Menlo,monospace" font-size="10">
    <rect x="24" y="514" width="22" height="14" rx="2" fill="rgba(226,104,60,0.08)" stroke="#e2683c" stroke-width="1"/>
    <text x="54" y="525" fill="#a0a6ae">available today</text>
    <rect x="200" y="514" width="22" height="14" rx="2" fill="url(#shatch)" stroke="#6b7178" stroke-width="1" stroke-dasharray="4 3"/>
