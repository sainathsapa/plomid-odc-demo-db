    <rect x="300" y="152" width="288" height="80" rx="2" fill="rgba(226,104,60,0.08)" stroke="#e2683c" stroke-width="1"/>
    <rect x="576" y="164" width="10" height="10" fill="#e2683c"/>
    <text x="316" y="186" font-size="14" font-weight="600" fill="#f2f2ef">Parser · Planner · Executor</text>
    <text x="316" y="208" font-family="'IBM Plex Mono',ui-monospace,Menlo,monospace" font-size="9.5" fill="#a0a6ae">one path for every statement</text>
    <text x="316" y="222" font-family="'IBM Plex Mono',ui-monospace,Menlo,monospace" font-size="9" fill="#e2683c">AVAILABLE TODAY</text>

    <rect x="612" y="152" width="288" height="80" rx="2" fill="rgba(226,104,60,0.08)" stroke="#e2683c" stroke-width="1"/>
    <rect x="888" y="164" width="10" height="10" fill="#e2683c"/>
    <text x="628" y="186" font-size="14" font-weight="600" fill="#f2f2ef">Joins · CTEs · windows</text>
    <text x="628" y="208" font-family="'IBM Plex Mono',ui-monospace,Menlo,monospace" font-size="9.5" fill="#a0a6ae">incl. lateral · recursive · frames</text>
    <text x="628" y="222" font-family="'IBM Plex Mono',ui-monospace,Menlo,monospace" font-size="9" fill="#e2683c">AVAILABLE TODAY</text>

    <rect x="924" y="152" width="288" height="80" rx="2" fill="rgba(226,104,60,0.08)" stroke="#e2683c" stroke-width="1"/>
    <rect x="1200" y="164" width="10" height="10" fill="#e2683c"/>
    <text x="940" y="186" font-size="14" font-weight="600" fill="#f2f2ef">Prepared statements</text>
    <text x="940" y="208" font-family="'IBM Plex Mono',ui-monospace,Menlo,monospace" font-size="9.5" fill="#a0a6ae">extended query · parse/bind</text>
    <text x="940" y="222" font-family="'IBM Plex Mono',ui-monospace,Menlo,monospace" font-size="9" fill="#e2683c">AVAILABLE TODAY</text>

    <rect x="1236" y="152" width="300" height="80" rx="2" fill="url(#shatch)" stroke="#6b7178" stroke-width="1" stroke-dasharray="4 3"/>
    <rect x="1512" y="164" width="10" height="10" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="1"/>
    <text x="1252" y="186" font-size="14" font-weight="600" fill="#a0a6ae">Vector · Graph · Dist.</text>
    <text x="1252" y="208" font-family="'IBM Plex Mono',ui-monospace,Menlo,monospace" font-size="9.5" fill="#6b7178">ANN · traversal · multi-node</text>
    <text x="1252" y="222" font-family="'IBM Plex Mono',ui-monospace,Menlo,monospace" font-size="9" fill="#6b7178">ROADMAP</text>
  </g>

