  <g font-family="'Inter',-apple-system,'Segoe UI',system-ui,sans-serif">
    <rect x="300" y="290" width="288" height="80" rx="2" fill="rgba(226,104,60,0.08)" stroke="#e2683c" stroke-width="1"/>
    <rect x="576" y="302" width="10" height="10" fill="#e2683c"/>
    <text x="316" y="324" font-size="14" font-weight="600" fill="#f2f2ef">Write-ahead log</text>
    <text x="316" y="346" font-family="'IBM Plex Mono',ui-monospace,Menlo,monospace" font-size="9.5" fill="#a0a6ae">segmented · fsync · replay</text>
    <text x="316" y="360" font-family="'IBM Plex Mono',ui-monospace,Menlo,monospace" font-size="9" fill="#e2683c">AVAILABLE TODAY</text>

    <rect x="612" y="290" width="288" height="80" rx="2" fill="rgba(226,104,60,0.08)" stroke="#e2683c" stroke-width="1"/>
    <rect x="888" y="302" width="10" height="10" fill="#e2683c"/>
    <text x="628" y="324" font-size="14" font-weight="600" fill="#f2f2ef">Checkpoint recovery</text>
    <text x="628" y="346" font-family="'IBM Plex Mono',ui-monospace,Menlo,monospace" font-size="9.5" fill="#a0a6ae">crash-safe restarts</text>
    <text x="628" y="360" font-family="'IBM Plex Mono',ui-monospace,Menlo,monospace" font-size="9" fill="#e2683c">AVAILABLE TODAY</text>

    <rect x="924" y="290" width="288" height="80" rx="2" fill="rgba(226,104,60,0.08)" stroke="#e2683c" stroke-width="1"/>
    <rect x="1200" y="302" width="10" height="10" fill="#e2683c"/>
    <text x="940" y="324" font-size="14" font-weight="600" fill="#f2f2ef">Indexes</text>
    <text x="940" y="346" font-family="'IBM Plex Mono',ui-monospace,Menlo,monospace" font-size="9.5" fill="#a0a6ae">ART in-memory · B+Tree persistent</text>
    <text x="940" y="360" font-family="'IBM Plex Mono',ui-monospace,Menlo,monospace" font-size="9" fill="#e2683c">AVAILABLE TODAY</text>

    <rect x="1236" y="290" width="300" height="80" rx="2" fill="rgba(226,104,60,0.08)" stroke="#e2683c" stroke-width="1"/>
    <rect x="1512" y="302" width="10" height="10" fill="#e2683c"/>
    <text x="1252" y="324" font-size="14" font-weight="600" fill="#f2f2ef">CRC32C integrity</text>
    <text x="1252" y="346" font-family="'IBM Plex Mono',ui-monospace,Menlo,monospace" font-size="9.5" fill="#a0a6ae">hardware accelerated</text>
    <text x="1252" y="360" font-family="'IBM Plex Mono',ui-monospace,Menlo,monospace" font-size="9" fill="#e2683c">AVAILABLE TODAY</text>
  </g>

