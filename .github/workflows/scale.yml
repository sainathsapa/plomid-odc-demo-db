name: Nightly scale + benches

# On-demand only: scale (100K/300K matrix, 1M soak, fuzz-200, all #[ignore])
# and criterion bench compile. Never runs on push/PR — push CI and release
# gates run the required Tier C subset only (`make test-ci`: unit +
# bounded integration, #[ignore] scale gates off) to stay in the 30-min
# budget and within the 14 GiB runner disk.
# Trigger manually when a perf number is needed, or let the weekly
# schedule catch regressions.
on:
  schedule:
    - cron: "0 3 * * 0" # weekly Sunday 03:00 UTC
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Same rationale as CI: scale jobs compile fresh; incremental artifacts
  # only consume disk on these runners.
  CARGO_INCREMENTAL: 0

jobs:
  scale:
    name: 🧪 scale rip (ignored + fuzz + soak)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@70dec6087f2cb6bab9fbac4da23160afbe848e91 # 1.99.0
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: df -h
      - run: make test-full
      - run: df -h; df -i; du -sh target
      - name: 🧹 sweep scale fixtures + report disk
        if: always()
        run: |
          rm -rf "${TMPDIR:-/tmp}"/plomid-* "${RUNNER_TEMP:-/tmp}"/plomid-* ./target/tmp/plomid-* 2>/dev/null || true
          df -h; df -i; du -sh target
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gauntlet-report-nightly
          path: target/gauntlet_report.md
          if-no-files-found: warn

  benches:
    name: 📊 bench compile check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@70dec6087f2cb6bab9fbac4da23160afbe848e91 # 1.99.0
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: make bench-check
